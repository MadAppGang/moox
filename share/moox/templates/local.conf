# ~/.config/moox/local.conf — your own tmux settings, loaded after moox's.
#
# `moox setup` wrote this file once and never overwrites it. moox.conf sources it
# after its options, plugins, keys, theme and status line, and before the gate,
# so anything here wins over moox's defaults and @moox-sockets below is what the
# gate reads. Reload with prefix r.

# ── Which tmux servers get Claude continuity and save/restore ───────────────
# Space-separated globs matched against the socket NAME (the -L name, or the
# basename of a -S path). Default: "default", the server plain `tmux` starts.
#   set -g @moox-sockets "default"
#   set -g @moox-sockets "default work"
#   set -g @moox-sockets "*"            # every server

# ── Examples ────────────────────────────────────────────────────────────────
# Switch windows with Meta-1..9 (for a terminal that sends Cmd-N as ESC N):
#   bind -n M-1 select-window -t 1
#   bind -n M-2 select-window -t 2
#
# Copy mode and paste without the prefix:
#   bind -n M-c copy-mode
#   bind -n M-v paste-buffer
#
# Save interval knobs read by the moox daemon (defaults shown):
#   set -g @moox-save-debounce 3s
#   set -g @moox-save-max-wait 30s
#   set -g @moox-save-backup 15m
