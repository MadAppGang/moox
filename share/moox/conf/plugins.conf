# plugins.conf — the vendored plugins (share/moox/plugins, pinned in PINS).
#
# Each entry script runs synchronously, as TPM ran them, one fork per plugin per
# load. A plugin script runs inside the job, so its bare `tmux` reaches THIS
# server through the job's $TMUX. Silent and `|| true`, like every run-shell
# moox has (options.conf header).
#
# Order matters (architecture §3.1): pain-control BEFORE tmux-jump, so jump's
# `prefix j` wins over pain-control's select-pane; catppuccin late, so the
# theme formats in theme.conf (sourced after this file) replace its literal
# styles; keys.conf, sourced after this file, overrides pain-control's `prefix h`.
run-shell '"#{@moox-root}/plugins/tmux-sensible/sensible.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-yank/yank.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-open/open.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-pain-control/pain_control.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-jump/tmux-jump.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-fzf/main.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-fzf-url/fzf-url.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/catppuccin-tmux/catppuccin.tmux" >/dev/null 2>&1 || true'
run-shell '"#{@moox-root}/plugins/tmux-copy-image/tmux-copy-image.tmux" >/dev/null 2>&1 || true'

# tmux-fingers is not vendored: it comes from the Homebrew formula (a binary)
# and configures itself with `tmux-fingers load-config` when it is installed.
if-shell 'command -v tmux-fingers >/dev/null 2>&1' 'run-shell "tmux-fingers load-config >/dev/null 2>&1 || true"'

# Last: the plugins above bind keys at load time, outside any file the conf-lint
# reads, and some of those bindings print or exit non-zero — tmux-fingers'
# `prefix F`/`J` and its whole `fingers` key table (`send-input noop` exits 1),
# tmux-sensible's two-line `prefix R`. A job like that is the 3.7b print-path
# crash once its client is gone, so their run-shell bindings are rewrapped
# `( … ) >/dev/null 2>&1 || true` on the server (scripts/silence-bindings.sh).
run-shell '"#{@moox-root}/scripts/silence-bindings.sh" "#{@moox-root}" >/dev/null 2>&1 || true'
