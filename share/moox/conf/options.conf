# options.conf — generic options, plus EVERYTHING a plugin reads at load.
#
# Sourced by moox.conf FIRST, before plugins.conf (architecture §3.1, PR-H9):
# tmux-sensible reads the prefix at load to bind `prefix a`, catppuccin reads the
# @catppuccin_* options with `set -ogqF`, tmux-fingers/fzf/jump/yank read their
# @-options. Personal keys and options go in ~/.config/moox/local.conf.
#
# EVERY run-shell in moox's config is silenced and forced to exit 0. This is not
# tidiness — it is the difference between a working server and a dead one.
# Reproduced on tmux 3.7b (2026-08-17): if the client that issued a run-shell
# goes away while the job is still running, tmux segfaults when the job finishes
# and it tries to print (cmd_run_shell_print -> server_client_print ->
# proc_send), taking every session with it. A job that prints anything, or exits
# non-zero (tmux prints its own "returned N" line), takes that path; a silent job
# that exits 0 cannot. A config-load run-shell is exactly the risky shape: the
# client that sources the config is often a transient `tmux new-session`.

# ====================================
# General
# ====================================

# True colour
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ',*:clipboard'

# Pass extended key sequences (Shift+Enter, etc.) through to applications
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

set -g mouse on

# Scrollback. Set here, explicitly, and not left to tmux-sensible: the
# bootstrap pane of a cold start is created right after the config's gate runs,
# and a pane keeps the history-limit it was created with (RR17). tmux-sensible
# only raises the limit when it is still tmux's default, so it leaves this one.
set -g history-limit 50000

# Preserve the outer terminal's identity (TERM_PROGRAM) so programs such as
# Claude Code can detect Shift+Enter support inside tmux.
set -ga update-environment "TERM_PROGRAM"
# COLORFGBG is deliberately NOT in update-environment: iTerm exports "15;0" for
# a light profile exactly as for a dark one, so copying it from the attaching
# client only ever copied "dark". theme.sh writes the value a pane inherits per
# session, from the mode the session's screens resolve to.

# The session name as the terminal window title
set -g set-titles on
set -g set-titles-string "#{session_name}"
set -g allow-passthrough on
set -g focus-events on

# ====================================
# Prefix and copy mode (plugins read these at load)
# ====================================

# Prefix Ctrl+a. tmux-sensible binds `prefix a` (send-prefix) from this value.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# vi keys in copy mode; tmux-yank and tmux-fingers read mode-keys at load.
setw -g mode-keys vi

# ====================================
# Plugin options (read by the plugins at load)
# ====================================

# tmux-fingers: quick-select patterns on screen (prefix + F)
set -g @fingers-key F
set -g @fingers-skip-wizard 1

# tmux-fzf-url: searchable list of URLs (prefix + u), over the visible screen
# plus 5000 lines of scrollback (the default is the visible screen only).
set -g @fzf-url-history-limit '5000'

# tmux-jump: easymotion-style jump (prefix + j)
set -g @jump-key 'j'

# tmux-yank: the system clipboard
set -g @yank-selection 'clipboard'
set -g set-clipboard on

# tmux-fzf: fuzzy finder for sessions/windows/panes (prefix + f)
TMUX_FZF_LAUNCH_KEY="f"

# ====================================
# Theme: two palettes, light and dark (the part catppuccin reads)
# ====================================
#
# The palette itself lives in scripts/theme.sh, which holds a dark set
# (Catppuccin Mocha) and a light set and is PER SCREEN: every @thm_* holds a
# format that picks the dark or the light hex for the client being drawn, so a
# cream window and a dark one attached to the same session each draw their own
# bar at the same moment. conf/theme.conf installs it, after the plugins, and
# binds it to prefix+T.
#
# Nothing here may set @thm_* — theme.sh owns those, and a value set at parse
# time would clobber the per-screen palette on every reload. Anything that READS
# one must read it as #{E:@thm_…}: a bare #{@thm_…} yields the format text.
#
# The `# >>> theme: NAME >>>` / `# <<< theme: NAME <<<` pairs (pre-plugin here;
# formats and apply in theme.conf) mark what tests/theme-per-screen.test.sh
# sources, byte for byte, into a private tmux server. Keep each marker a whole
# line, used once.
# >>> theme: pre-plugin >>>
set -g status-position bottom

# --- Catppuccin layout options (must be set before the plugin loads) --------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_window_status_style "basic"
# "default" here means "fill the bar with @thm_mantle" (the plugin's naming is
# confusing). Mantle is a near-background tone in BOTH palettes, so the bar
# reads as a subtle slab either way. theme.sh re-sets status-style itself, as a
# per-screen format, after every load: the plugin bakes it to one literal.
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_status_connect_separator "yes"
# Window names sit on the bar itself; only the index gets a chip.
set -g @catppuccin_window_text_color "#{E:@thm_mantle}"
set -g @catppuccin_window_current_text_color "#{E:@thm_mantle}"
# Both number chips are read as #{E:@catppuccin_window_*number_color} by the
# window formats in theme.conf, and E: expands ONE level of indirection fully,
# so the pins carry their own E: (a bare "#{@thm_yellow}" drew the raw format
# text). theme.sh's chrome writes the same two values again.
set -g @catppuccin_window_number_color "#{E:@thm_overlay_2}"
set -g @catppuccin_window_current_number_color "#{E:@thm_yellow}"

# Every one of the four colours per module is pinned here, icon half included:
# utils/status_module.conf declares `set -ogqF "@catppuccin_status_${MODULE}_icon_fg"
# "#{E:@thm_crust}"`, where -F expands NOW and -o refuses to overwrite, so the
# first load would bake a literal hex that every later reload keeps.
set -g @catppuccin_status_session_icon_bg "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_status_session_icon_fg "#{E:@thm_crust}"
set -g @catppuccin_status_session_text_bg "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_status_session_text_fg "#{E:@thm_crust}"
set -g @catppuccin_status_date_time_icon_bg "#{E:@thm_sapphire}"
set -g @catppuccin_status_date_time_icon_fg "#{E:@thm_crust}"
set -g @catppuccin_status_date_time_text_bg "#{E:@thm_sapphire}"
set -g @catppuccin_status_date_time_text_fg "#{E:@thm_crust}"
# <<< theme: pre-plugin <<<
