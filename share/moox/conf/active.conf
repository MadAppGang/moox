# active.conf — moox's continuity machinery, sourced by moox.conf ONLY when the
# gate (`tt serve --ensure`) set @moox-active to 1, i.e. when this server's
# socket matches @moox-sockets (A4, D7). A server that does not match gets keys,
# theme and plugins, and none of this.
#
# Hook slots (architecture §5.1). tmux hook arrays are indexed per hook name;
# each moox subsystem owns ONE fixed index on every hook name it registers, so
# two subsystems on the same hook never overwrite each other, an indexed
# `set-hook -g NAME[i]` replaces itself on reload, and an unindexed one (which
# clears the whole array) never appears. Plugins' `-ga` appends land above.
#   [100] theme                  theme.conf
#   [101] saver: moox-dirty      this file
#   [102] saver: moox-touch      this file
#   [103] continuity tab colour  this file
#   [104] tt sidebar             tt.conf
#   [105] tmux-copy-image        plugins/tmux-copy-image/plugin/tmux-clip-image.tmux
# Deactivation (the gate, when the socket stops matching) unsets 101–104 and
# the C-s and Z keys; 100 and 105 stay. Keep this table, that list and
# TestConf_HookIndexTableUnique in step.

# ── Saver events (§5.1) ──────────────────────────────────────────────────────
# Hook text is tmux commands only: no fork, no client. The daemon (tt serve)
# holds the waiters, debounces dirty events into one save (3 s, at most 30 s),
# and arms the 15-minute backup on a touch.
# A dirty hook also counts itself in @moox-dirty-seq. tmux keeps a signal for
# a later waiter only while it is the only one — a second `wait-for -S` with
# no waiter blocked deletes the woken channel (cmd-wait-for.c) — so the two
# hooks of one action (window-renamed + after-rename-window) cancel out when
# they land between two waiters. The daemon's waiter prints the counter as it
# blocks and as it wakes (`display ; wait-for ; display`, one client) and
# treats a counter that moved in between as a dirty event.
set-hook -g 'window-layout-changed[101]' { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'window-linked[101]'         { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'window-unlinked[101]'       { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'window-renamed[101]'        { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'session-created[101]'       { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'session-closed[101]'        { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'session-renamed[101]'       { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'pane-exited[101]'           { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'pane-died[101]'             { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'after-new-window[101]'      { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'after-split-window[101]'    { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'after-kill-pane[101]'       { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'after-rename-window[101]'   { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
set-hook -g 'after-rename-session[101]'  { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
# A detach asks for a save WITH pane contents: the save reads the flag in its
# chained read and clears it after (R2-C4). No fifth waiter.
set-hook -g 'client-detached[101]'       { set -g @moox-want-contents 1 ; set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }

set-hook -g 'after-select-window[102]'    'wait-for -S moox-touch'
set-hook -g 'window-pane-changed[102]'    'wait-for -S moox-touch'
set-hook -g 'client-session-changed[102]' 'wait-for -S moox-touch'
set-hook -g 'client-attached[102]'        'wait-for -S moox-touch'

# Hooks that exist only from tmux 3.8. @moox-tmux-38 is set by the gate from
# the server's parsed version (a string compare would get "3.10" wrong).
if -F '#{==:#{@moox-tmux-38},1}' {
  set-hook -g 'window-created[101]'             { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'window-closed[101]'              { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'pane-created[101]'               { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'pane-moved[101]'                 { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'after-swap-window[101]'          { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'session-added-to-group[101]'     { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'session-removed-from-group[101]' { set -gF @moox-dirty-seq '#{e|+:#{@moox-dirty-seq},1}' ; wait-for -S moox-dirty }
  set-hook -g 'pane-shell-prompt[102]'          'wait-for -S moox-touch'
}

# prefix C-s: save now (the daemon saves with contents and acks the request).
bind C-s { wait-for -S moox-save ; display "moox: save requested" }

# ── Claude session tab colour (continuity's cc_tab_reconcile.sh) ─────────────
# Clear or move a tab's colour when the Claude session behind it goes away, and
# repaint on the user actions that can change it. BOTH pane-exited and
# after-kill-pane are needed: pane-exited does not fire on kill-pane (measured
# at 3.7c). `/color` in Claude emits no event at all, so the select/focus hooks
# are what make a new colour show up; they target ONE window (run-shell expands
# #{window_id} inside a hook), about 65 ms instead of a sweep.
set-hook -g 'pane-exited[103]'            { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' --all >/dev/null 2>&1 || true" }
set-hook -g 'after-kill-pane[103]'        { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' --all >/dev/null 2>&1 || true" }
set-hook -g 'after-select-window[103]'    { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' '#{window_id}' >/dev/null 2>&1 || true" }
set-hook -g 'pane-focus-in[103]'          { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' '#{window_id}' >/dev/null 2>&1 || true" }
set-hook -g 'client-attached[103]'        { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' --all >/dev/null 2>&1 || true" }
set-hook -g 'client-session-changed[103]' { run-shell -b "'#{@moox-root}/plugins/tmux-claude-continuity/scripts/cc_tab_reconcile.sh' --all >/dev/null 2>&1 || true" }

# ── The freeze manager (prefix Z) ────────────────────────────────────────────
# Moved here from the deleted tmux-claude-continuity.tmux (PR-H10). Z is unbound
# in default tmux (prefix z is zoom). display-popup does not format-expand its
# command (cmd-display-menu.c), so the path comes from $MOOX_ROOT, which the
# gate exported into the server's environment before this file was sourced;
# `\$` keeps it for the popup's shell to expand.
bind Z display-popup -E -w 90% -h 85% "\"\$MOOX_ROOT/plugins/tmux-claude-continuity/scripts/cc_popup.sh\""

# ── tt's sidebar (slot 104) ──────────────────────────────────────────────────
source-file -F '#{@moox-root}/conf/tt.conf'
