# keys.conf — generic key bindings, sourced AFTER plugins.conf so these win:
# `prefix h` is a split here, not pain-control's select-pane (vim-tmux-navigator's
# Ctrl-h covers that), and `prefix F` stays tmux-fingers'.
# Personal keys (terminal-specific Meta bindings and the like) belong in
# ~/.config/moox/local.conf.

# Reload: re-source whatever config this server was started with (the 2-line
# ~/.tmux.conf entry, or moox's own -f file). With two -f files
# #{config_files} is a comma-joined list, which is not a path; the gate then
# re-binds r to `source-file '<f1>' '<f2>' …` (PV2).
bind r source-file -F '#{config_files}' \; display "moox: reloaded"

# Split panes — v = side by side, h = stacked (h overrides pain-control's
# `prefix h`, which is redundant with vim-tmux-navigator's Ctrl-h). The pipe
# and dash bindings stay as aliases.
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation: vim-tmux-navigator (C-h/j/k/l). Resizing: tmux-pain-control
# (prefix + shift+arrows).

# Swap the window to a target index (instead of the default move-window)
bind . command-prompt -T target "swap-window -t '%%'"

# Prompt labels: the default commands, relabelled to sit better on the message
# bar. The label MUST be plain text: tmux sizes the input's starting column with
# format_width() over the raw string, so a `#[fg=…]` chip makes what you type
# land at column 0 on top of the window list (measured at 3.7c).
bind , command-prompt -I "#W" -p " rename window:" { rename-window "%%" }
bind '$' command-prompt -I "#S" -p " rename session:" { rename-session "%%" }
bind : command-prompt -p " :"

# Toggle the status bar
bind b set-option status

# prefix Option-Left/Right resizes 5 columns (tmux's M-Left/M-Right), but
# Mac-style terminals send Option-Left/Right as the readline word jumps
# ESC b / ESC f, so tmux sees M-b / M-f. Bind those to the same resize.
bind -r M-b resize-pane -L 5
bind -r M-f resize-pane -R 5

# Copy mode: v starts a selection; tmux-yank handles y/Enter.
bind -T copy-mode-vi v send -X begin-selection
