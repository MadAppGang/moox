# theme.conf — the theme's formats and its apply step, sourced after plugins.conf
# and keys.conf, so these formats replace catppuccin's literal styles. The
# pre-plugin half (the @catppuccin_* options catppuccin reads at load) is in
# options.conf. theme.sh is the palette and the per-screen logic.

# >>> theme: formats >>>
# ── Claude session tab colour ───────────────────────────────────────────────
#
# A window tab can carry the colour of the Claude session living in it. The
# window option @cc_colour holds a TOKEN ("green"), never a hex. That single
# decision is what makes every coloured tab follow the theme for free: the
# chains below resolve @thm_cc_* at DRAW time, for the screen being drawn,
# exactly like Catppuccin's own colours, so a cream screen and a dark one each
# draw the tabs in their own palette, and a switch repaints them with no
# per-window work. Storing a hex would force theme.sh to walk every window on
# every toggle, would silently freeze the old palette into any window it
# missed, and could never show one tab in two palettes at once.
#
# Who writes it: the vendored tmux-claude-continuity plugin's cc_tab_reconcile.sh,
# from Claude's own ~/.claude/sessions/*.json records, plus
# the "Tab colour" entry in the prefix+T theme menu for a manual pin. Nothing in
# THIS file ever computes a colour.

# INHERITANCE FLOOR — not tidiness, and not optional.
#
# MEASURED at 3.7c: a window user option that has never been set resolves
# through to the GLOBAL value of the same name. Without these three lines a
# window nobody has coloured inherits whatever the last `set -g @cc_colour …`
# left behind, so colouring ONE tab would colour every tab that had not been
# explicitly set. With the floor in place "unset" means exactly one thing —
# `default`, i.e. today's uncoloured appearance.
#
# It is also why CLEARING a window's colour is `set -wu -t @<win> @cc_colour`,
# dropping back to this floor, and never `set -w … ""`.
set -g @cc_colour default
set -g @cc_colour_pin ""
set -g @cc_name ""

# Where a tab's TEXT comes from. Three values, read by the reconciler — this
# file only states the contract, the reconciler decides whether to write
# @cc_name at all, and the formats below simply prefer @cc_name when it is
# non-empty:
#
#   window   never use the Claude name; tabs show #W (pre-feature behaviour)
#   user     THE DEFAULT — use the Claude session name only when that record's
#            nameSource is exactly "user", i.e. a name the human typed
#   session  always use the Claude name when the session has one
#
# `user` is the default because of what the live data actually looks like: of
# 33 live sessions, 21 are nameSource:derived, 9 are auto and only 3 are user.
# The derived names are "dotfiles-27" and "task3-22"; the window names they
# would overwrite are "deploy shop-api", "models selection", "data model" —
# hand-set and meaningful. Always-on would be a regression, so only the names a
# human chose are allowed to win.
#
# nameSource also takes "auto", so the reconciler must test `== "user"` and
# never `!= "derived"`.
set -g @cc_tab_name_source user

# The token -> hex chains.
#
# MEASURED, and it is the limit that forces this shape: dynamic option names do
# not work in 3.7c. `#{E:@thm_cc_cur_#{@cc_colour}}` yields the literal string
# "@thm_cc_cur_green" — E: interpolates the inner format but does not re-enter
# option lookup, and #{E:#{E:…}} does not either. Hence an explicit 8-way chain
# instead of a one-line computed lookup.
#
# The TAIL of each chain is the existing Catppuccin colour, so `default`, the
# empty string, AND any unrecognised token all land on exactly today's
# appearance. Generated and bracket-balanced — do not retype these by hand.
set -g @cc_fill_current "#{?#{==:#{@cc_colour},red},#{E:@thm_cc_cur_red},#{?#{==:#{@cc_colour},orange},#{E:@thm_cc_cur_orange},#{?#{==:#{@cc_colour},yellow},#{E:@thm_cc_cur_yellow},#{?#{==:#{@cc_colour},green},#{E:@thm_cc_cur_green},#{?#{==:#{@cc_colour},cyan},#{E:@thm_cc_cur_cyan},#{?#{==:#{@cc_colour},blue},#{E:@thm_cc_cur_blue},#{?#{==:#{@cc_colour},purple},#{E:@thm_cc_cur_purple},#{?#{==:#{@cc_colour},pink},#{E:@thm_cc_cur_pink},#{E:@catppuccin_window_current_text_color}}}}}}}}}"
set -g @cc_fill_inactive "#{?#{==:#{@cc_colour},red},#{E:@thm_cc_dim_red},#{?#{==:#{@cc_colour},orange},#{E:@thm_cc_dim_orange},#{?#{==:#{@cc_colour},yellow},#{E:@thm_cc_dim_yellow},#{?#{==:#{@cc_colour},green},#{E:@thm_cc_dim_green},#{?#{==:#{@cc_colour},cyan},#{E:@thm_cc_dim_cyan},#{?#{==:#{@cc_colour},blue},#{E:@thm_cc_dim_blue},#{?#{==:#{@cc_colour},purple},#{E:@thm_cc_dim_purple},#{?#{==:#{@cc_colour},pink},#{E:@thm_cc_dim_pink},#{E:@catppuccin_window_text_color}}}}}}}}}"

# Bell-aware window format.
#
# The index chip's text is @thm_bg, NOT @thm_crust. The two chip states are
# deliberately inverted, and @thm_bg is the only value that inverts with the
# palette to keep both readable:
#
#   inactive  bg=overlay_2 (a mid grey)   fg=@thm_bg  -> light text on light
#                                                        palette, dark text on
#                                                        dark palette
#   current   bg=yellow    (a strong amber) fg=@thm_crust -> always dark text
#
# @thm_crust is near-black in both palettes, so using it here put dark text on
# the dark grey chip in light mode. A bell still forces crust, because the bell
# chip is amber and needs the dark-on-amber pairing.
#
# The NAME half additionally carries the Claude session colour as its
# background, via @cc_fill_inactive. Three things about that:
#
#  * The bell still wins. A bell repaints BOTH halves amber, because a bell is
#    an alert and must not be outranked by a decorative tint.
#  * The ink is chosen by comparing the RESOLVED FILL against the fallback, not
#    by testing the token. MEASURED: with a token test, an unknown token (say
#    "chartreuse", which a future Claude build could emit) takes the fallback
#    FILL but the coloured INK — a mismatched pair. Deriving the ink from the
#    fill makes the two halves structurally unable to disagree, so `default`,
#    empty and unknown all behave identically.
#  * When uncoloured this is byte-for-byte the old format: fg=@thm_fg on
#    @catppuccin_window_text_color. The change is additive and reversible.
#
# `#W` is wrapped so a non-empty @cc_name replaces it. @cc_name is written ONLY
# by the reconciler, and only when @cc_tab_name_source says it may (above), so
# with the plugin absent this collapses to plain #W.
set -g window-status-format "#[fg=#{?window_bell_flag,#{E:@thm_crust},#{E:@thm_bg}},bg=#{?window_bell_flag,#{E:@thm_yellow},#{E:@catppuccin_window_number_color}}] #I #[fg=#{?window_bell_flag,#{E:@thm_crust},#{?#{==:#{E:@cc_fill_inactive},#{E:@catppuccin_window_text_color}},#{E:@thm_fg},#{E:@thm_cc_ink_dim}}},bg=#{?window_bell_flag,#{E:@thm_yellow},#{E:@cc_fill_inactive}}] #{?#{==:#{@cc_name},},#W,#{@cc_name}} "

# The current-window format is redefined here for the same reason, and it is
# NOT cosmetic. Catppuccin builds its version as
#
#   set -g  @_ctp_w_number_style "#[fg=#{@thm_crust},bg=...]"
#   set -gF window-status-current-format "#{E:@_ctp_w_number_style}..."
#
# where -F plus the inner E: resolves @thm_crust ONCE, at plugin-load time, and
# stores the literal. So the chip keeps whichever palette was active during the
# last full config reload and silently ignores every later switch — toggling to
# dark left the current chip carrying the light palette's #3c3836.
#
# Written out with #{E:@thm_*} left intact, it resolves at draw time instead and
# tracks the palette like everything else. That reason is exactly why the
# #{E:@cc_fill_current} below must also stay unexpanded here — a `set -gF` on
# this line would bake one window's colour into every tab, permanently.
#
# `bold` is the THIRD active/inactive signal, after fill brightness and ink
# polarity. It is the one that still reads when the two fills are closest
# (light-theme yellow, 1.41:1 apart) and the only one that survives a
# colour-blind reading of the hue.
#
# It is applied ONLY to a coloured tab, through the SAME fill-vs-fallback test
# the ink uses, so the two can never disagree. Two reasons, one of design and
# one measured:
#
#  * An uncoloured window has no coloured inactive counterpart to be told apart
#    from — the amber/grey index chip already does that job — so bold buys it
#    nothing.
#  * MEASURED: an unconditional `bold` costs byte-identity. Expanded on an
#    uncoloured window it emits `…,bold`, and PAINTED it wraps the name half in
#    ESC[1m … ESC[0m where today there is nothing at all. Conditional, an
#    uncoloured tab expands and paints byte-for-byte as it does today, in both
#    palettes.
#
# The bold is a SEPARATE `#[bold]` rather than a `#{?…,nobold,bold}` attribute
# inside the style. Both paint correctly — `nobold` is a valid attribute at
# 3.7c and tmux emits no SGR for it — but `nobold` still leaves a literal
# `…,nobold` in the expanded format, so only this form survives a `diff` of the
# expansion against the old one. Verified with a real client: coloured, this
# paints ESC[1m in exactly the same place as the old inline `,bold` did.
#
set -g window-status-current-format "#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_window_current_number_color}] #I #[fg=#{?#{==:#{E:@cc_fill_current},#{E:@catppuccin_window_current_text_color}},#{E:@thm_fg},#{E:@thm_crust}},bg=#{E:@cc_fill_current}]#{?#{==:#{E:@cc_fill_current},#{E:@catppuccin_window_current_text_color}},,#[bold]} #{?#{==:#{@cc_name},},#W,#{@cc_name}} "

# Status bar content
set -g status-left-length 80
set -g status-right-length 150
set -g status-left "#{E:@catppuccin_status_session}"
# <<< theme: formats <<<

# >>> theme: apply >>>
# The light/dark theme, per screen. MUST come after the plugins: Catppuccin
# bakes status-style, message-style, the pane borders, popups and menus to
# literals at load time (`set -gF`), and theme.sh has to be the last writer of
# each, replacing them with formats that resolve per screen (see theme.sh).

# Who a hook is about, as NAME:PID. A bare tty name is handed to the next
# client that opens that pty; the pid is not. #{L:} builds each client's
# format tree with the hook's own item, so #{hook_client} still resolves
# inside the loop. Control-mode clients yield nothing: they never draw, so they
# never lead (and never vote: a window they watch is never painted for them).
# One rule of theirs still beats the paint, though: while a control client is
# attached, a pane background it reported with `refresh-client -r` decides
# what tmux tells that pane's programs (996/997), painted or not
# (window.c:1919, 1954-1966). Nothing here runs one. These two formats are
# the identity the window-lead hooks below record.
#
# @theme_cmd_id names the client a command ran FOR, which for a command typed
# on a screen is that screen. A command from a script (tt, tmux-fzf, a Claude
# agent running `tmux select-window` or `new-window`) has a client with no
# session, and tmux then hands the format its best guess, the most recently
# active screen (cmd-find.c:1265-1279), so the hook records THAT screen as
# the lead. tmux itself does not move the window's `latest` for such a
# command (cmd-select-window.c:145 needs a session), so the two can differ,
# and while they do, typing on the screen that IS `latest` there fires no
# client-active (server_client_update_latest returns early), so the window
# keeps the recorded screen's palette until the recorded screen types there,
# or something else moves the lead. Not closable from a hook: no format
# exposes a window's `latest`, and after-* hooks carry no hook_client
# (cmd-queue.c:390-420). T3a pins the behaviour. Only with no screen attached
# at all (a restore) does @theme_cmd_id yield nothing, and its hooks then
# make no @ write.
set -g @theme_hook_id '#{L:#{?#{&&:#{==:#{client_name},#{hook_client}},#{!=:#{client_control_mode},1}},#{client_name}:#{client_pid},}}'
set -g @theme_cmd_id  '#{?client_name,#{?#{!=:#{client_control_mode},1},#{client_name}:#{client_pid},},}'

# Every event that can change a screen's mode, or which screens there are, or
# what a window's panes must be painted in, asks theme.sh to recompute
# (`sync`): a screen attaches or detaches, a terminal reports light or dark
# (tmux 3.6+ measures each client's background itself and fires
# client-light-theme / client-dark-theme), a session shows another window, a
# pane is split (the new pane joins its window's paint). sync coalesces a
# burst into one pass and writes only what changed.
#
# The last four are the LEAD hooks. While the screens viewing a window
# disagree, its panes are painted in the palette of the screen that used it
# last — tmux's own `latest` client for the window (see "Pane contents" in
# theme.sh). tmux sets `latest` in five places and fires a hook after four:
# a screen types or gains focus there (client-active), attaches or switches
# to the session (client-session-changed), presses a window key or clicks the
# window list (after-select-window), or opens a window (after-new-window).
# Each records that screen as NAME:PID in the window's @theme_lead, inside the
# hook itself, so the record is in place before the sync it triggers reads it.
# The `if -F` writes it only when it changed: an @ write redraws every client.
#
# Slot [100] is the theme's fixed index on every hook name it uses (moox's slot
# table, architecture §5.1). An indexed `set-hook -g NAME[100]` replaces itself
# on every load — so an edit deploys on `prefix r` and nothing piles up — and
# never touches another subsystem's slot on the same hook. `-b` so the server
# never waits; silent and `|| true` so the job can never print (options.conf).
# theme.sh's load_cleanup removes the -ga entries older configs appended.
set-hook -g 'client-attached[100]'        { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'client-detached[100]'        { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'client-light-theme[100]'     { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'client-dark-theme[100]'      { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'session-window-changed[100]' { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'after-split-window[100]'     { run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'client-active[100]'          { if -F '#{&&:#{E:@theme_hook_id},#{!=:#{@theme_lead},#{E:@theme_hook_id}}}' { set -wqF @theme_lead '#{E:@theme_hook_id}' } ; run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'client-session-changed[100]' { if -F '#{&&:#{E:@theme_hook_id},#{!=:#{@theme_lead},#{E:@theme_hook_id}}}' { set -wqF @theme_lead '#{E:@theme_hook_id}' } ; run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'after-select-window[100]'    { if -F '#{&&:#{E:@theme_cmd_id},#{!=:#{@theme_lead},#{E:@theme_cmd_id}}}' { set -wqF @theme_lead '#{E:@theme_cmd_id}' } ; run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }
set-hook -g 'after-new-window[100]'       { if -F '#{&&:#{E:@theme_cmd_id},#{!=:#{@theme_lead},#{E:@theme_cmd_id}}}' { set -wqF @theme_lead '#{E:@theme_cmd_id}' } ; run-shell -b "'#{@moox-root}/scripts/theme.sh' sync >/dev/null 2>&1 || true" }

# Drop the server's frozen copy of COLORFGBG: theme.sh writes a correct one per
# session, and until it has, absent beats wrong.
set-environment -gu COLORFGBG

# `auto` re-derives the server default (an explicit prefix+T pin if one was
# made, else the last default, else the theme of the screen most recently in
# use), removes theme hooks older configs appended, and reinstalls the
# per-screen chrome over everything Catppuccin just re-baked — then syncs every
# screen. macOS appearance and COLORFGBG are not consulted: a Mac can report
# Dark for the first and "15;0" for the second while iTerm runs a light
# profile. See the Detection note in theme.sh.
#
# stdout and stderr are discarded, and failure is swallowed, so this job can
# never hand tmux anything to print. The server crashed once (SIGSEGV in
# proc_send, 2026-08-16) delivering run-shell output to a client that had gone
# away, taking all 16 sessions with it — a run-shell that produces no output
# cannot enter that path at all. `|| true` matters as much as the redirect:
# tmux prints its own "returned 1" line when a job exits non-zero.
#
# A known, silent side effect of the reload: Catppuccin runs
# `set -gF clock-mode-colour "#{@thm_blue}"`, which now stores a format into a
# colour option and fails. plugins.conf discards plugin output and tmux stops
# only that line, and theme.sh rewrites the option a moment later.
run-shell '"#{@moox-root}/scripts/theme.sh" auto >/dev/null 2>&1 || true'

# prefix+T opens a picker on the screen that pressed it: the binding passes
# #{client_name}, so the menu opens there, its header says what THAT screen
# shows and why ("This screen: omarchy · dark (host)"), and its Toggle flips
# that screen. "This screen: Auto / Light / Dark" sets the mode of every screen
# on the same machine — the way to declare a mosh or Blink screen, which can
# never report its theme — and is remembered in ~/.config/tmux/screens;
# "All screens: Follow / Light / Dark" is the global pin. Each entry applies
# immediately, so the menu doubles as a preview: pick Dark, look at the bar,
# pick Light back. A blind toggle is one of the entries rather than its own
# binding — lowercase prefix+t is tmux's built-in clock and stays that way.
#
# This is also the ONLY entry point to the per-window Claude tab colour picker,
# which hangs off the "Tab colour" row rather than owning a key. It is the whole
# appearance surface, so one key is the honest shape — and the obvious mnemonic
# was never free: `list-keys -T prefix` shows capital C is tmux's own
# `customize-mode -Z`, so binding it here would have silently clobbered a
# built-in.
bind T run-shell '"#{@moox-root}/scripts/theme.sh" menu "#{client_name}" >/dev/null 2>&1 || true'
# <<< theme: apply <<<
