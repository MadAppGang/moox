# status.conf — the right-hand status line. Display only.
#
# There is NO `#()` save trigger here (D10, I6): saving is event-driven, by
# the moox daemon (tt serve) on tmux hooks (active.conf), never on the status
# interval.
#
# #{E:@tt_status} is tt's Claude-session counter ("3 waiting · 1 error"). A
# running tt observer writes it on real state changes only (no timer, no #()
# fork per redraw) and unsets it when it stops, so the segment is empty when
# nothing needs you or no observer runs. tt detects the placeholder once at
# startup: restart the observer after editing this line.
#
# Then the moox segment: a pinned-restore warning (@moox-warning, set by the
# gate at every config load while a snapshot is pinned after a failed
# restore, A16) outranks the save status line (@moox_status).
#
# Host chip: mauve when the screen DRAWING it is local, red when that screen is
# remote (ssh, tssh, mosh). It is per screen, because one session can be
# watched from two machines at once: theme.sh sync publishes the remote
# screens' ttys in @theme_remote, and the #[…] below tests the drawing
# client's tty against it. The chip's text is a plain format — the server
# glyph and `#H`, the hostname — so the status line runs no `#()` job at all
# (V2, D10; it used to fork scripts/host-status.sh per client per interval
# just to print that same constant, I-3).
set -g status-right "#{?@tt_status,#{E:@tt_status} ,}#{?@moox-warning,#[reverse] #{@moox-warning} #[noreverse],#{@moox_status}}#[fg=#{E:@thm_crust},bg=#{?#{m:* #{client_tty} *,#{@theme_remote}},#{E:@thm_red},#{E:@thm_mauve}}] 󰒋 #H #[default]#{E:@catppuccin_status_date_time}"
