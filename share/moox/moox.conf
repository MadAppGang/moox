# moox entry file — the only file ~/.tmux.conf and `moox -f` point at.
#
# The order below is the contract (architecture §3.1):
#   1) root  2) bin  3) @moox-sockets default
#   4) options → plugins → keys → theme → status   (generic config, every server)
#   5) the user's ~/.config/moox/local.conf          (personal, never overwritten)
#   6) the gate: `tt serve --ensure`                 (decides @moox-active)
#   7) active.conf, only where the gate said 1       (continuity, saver, tt)
# Every path is relative to the share root, so a brew, curl or dev install
# loads the same files.

# 1) The share root is this file's directory (PV1). Guarded so a load with no
#    current file (a command-line source) leaves an explicit @moox-root alone.
if -F '#{!=:#{current_file},}' { set -gF @moox-root '#{d:current_file}' }

# 2) Binary directory (E6): an already-set @moox-bin wins, then $MOOX_BIN from
#    the server's global environment, then the path relative to the root.
if -F '#{==:#{@moox-bin},}' { if -F '#{!=:#{MOOX_BIN},}' { set -gF @moox-bin '#{MOOX_BIN}' } { set -gF @moox-bin '#{@moox-root}/../../bin' } }
#    The copy-image helper rpaster is NOT in bin/ (the separate rpaster formula
#    owns that name; V10): moox's copy is in libexec/ beside share/. An already
#    set @moox-rpaster wins (local.conf may point at another rpaster); the
#    PATH fallback is `moox rpaster`'s and `moox doctor`'s.
if -F '#{==:#{@moox-rpaster},}' { set -gF @moox-rpaster '#{@moox-root}/../../libexec/rpaster' }

# 3) Which servers take part in continuity. -o never overwrites a value that
#    is already set (a test harness, or the user's local.conf on reload); -q
#    keeps that "already set" case from being reported as a config error.
set -ogq @moox-sockets "default"

# 4) The generic config, in this order (PR-H9): options carries everything a
#    plugin reads at load; keys come after the plugins so moox's bindings win;
#    the theme formats come after catppuccin so they replace its literals.
source-file -F '#{@moox-root}/conf/options.conf'
source-file -F '#{@moox-root}/conf/plugins.conf'
source-file -F '#{@moox-root}/conf/keys.conf'
source-file -F '#{@moox-root}/conf/theme.conf'
source-file -F '#{@moox-root}/conf/status.conf'

# 5) The user's own file, last of the user-facing ones. XDG_CONFIG_HOME is read
#    from the server's environment, exactly as `moox setup` resolves it.
source-file -qF '#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/moox/local.conf'

# 6) The gate. SYNCHRONOUS (no -b): the `if -F` below must see the @moox-active
#    it sets. It is silent and exits 0 on every path, like every run-shell here
#    (options.conf header), and it always writes @moox-active (1 or 0), so an
#    UNSET @moox-active after a load means the gate never ran (doctor says so).
#    It matches the socket against @moox-sockets, exports the MOOX_* environment
#    the shell hooks trust, and starts or keeps this server's daemon.
run-shell '"#{@moox-bin}/tt" serve --ensure --tmux-socket "#{socket_path}" >/dev/null 2>&1 || true'

# 7) Continuity, the saver hooks and tt's sidebar, only on a matching server.
#    Runtime `if`, not `%if`: a %if is decided when the file is parsed, before
#    the gate has run.
if -F '#{==:#{@moox-active},1}' { source-file -F '#{@moox-root}/conf/active.conf' }
