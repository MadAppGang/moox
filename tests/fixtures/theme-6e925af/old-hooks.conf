set-hook -ga client-light-theme     'run-shell -b "~/.tmux/scripts/theme.sh follow >/dev/null 2>&1 || true"'
set-hook -ga client-dark-theme      'run-shell -b "~/.tmux/scripts/theme.sh follow >/dev/null 2>&1 || true"'
set-hook -ga client-attached        'run-shell -b "~/.tmux/scripts/theme.sh follow >/dev/null 2>&1 || true"'
set-hook -ga client-session-changed 'run-shell -b "~/.tmux/scripts/theme.sh follow >/dev/null 2>&1 || true"'
set-hook -ga after-new-window       'run-shell -b "~/.tmux/scripts/theme.sh refresh \"#{session_name}\" >/dev/null 2>&1 || true"'
